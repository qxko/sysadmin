<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f8">
  <title>Sysadmin — Home Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="rail" aria-label="Main navigation">
      <a class="logo" href="#" aria-label="Home">S</a>
      <button class="rail-button active" aria-label="Devices">▦</button>
      <button class="rail-button" aria-label="Apps">◫</button>
      <button class="rail-button" aria-label="Activity">≋</button>
      <button class="rail-button settings" aria-label="Settings">⚙</button>
    </aside>
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">⌂</span><span><b>HOME LAB</b><small>SYSADMIN MANAGER</small></span></div>
      <div class="section-label">MY DEVICES <button aria-label="Add device">＋</button></div>
      <nav id="deviceList" aria-label="Devices"></nav>
      <div class="sidebar-foot"><i></i> 3 devices online</div>
    </aside>
    <main class="main">
      <header class="topbar"><div id="breadcrumbs"></div><div class="top-right"><span class="demo"><i></i> DEMO</span><span class="avatar">J</span></div></header>
      <div class="content">
        <div class="heading"><div><div class="eyebrow">HOME LAB / DEVICES</div><h1><span id="title"></span><small id="deviceType"></small></h1><p id="subtitle"></p></div><button id="refresh" class="refresh">↻ Refresh</button></div>
        <nav class="tabs" id="tabs" aria-label="Device sections"></nav>
        <div id="view" class="view"></div>
        <footer>SYSADMIN HOME LAB <span>DEMO DATA</span></footer>
      </div>
    </main>
  </div>
  <dialog id="dialog"><header><b id="dialogTitle">Demo action</b><button id="closeDialog" aria-label="Close">×</button></header><p id="dialogText"></p><button id="okay">OK</button></dialog>
  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
